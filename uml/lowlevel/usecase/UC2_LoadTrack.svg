<?xml version="1.0" encoding="us-ascii" standalone="no"?><svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" contentStyleType="text/css" height="634px" preserveAspectRatio="none" style="width:982px;height:634px;background:#FFFFFF;" version="1.1" viewBox="0 0 982 634" width="982px" zoomAndPan="magnify"><defs/><g><text fill="#000000" font-family="sans-serif" font-size="14" font-weight="bold" lengthAdjust="spacing" textLength="326" x="321" y="22.9951">UC2: Load Track - Use Case Specification</text><!--cluster UC2: Load Track--><g id="cluster_UC2: Load Track"><rect fill="none" height="103" rx="2.5" ry="2.5" style="stroke:#181818;stroke-width:1.0;" width="891" x="85" y="44.2969"/><text fill="#000000" font-family="sans-serif" font-size="14" font-weight="bold" lengthAdjust="spacing" textLength="130" x="465.5" y="59.292">UC2: Load Track</text></g><g id="elem_Select"><ellipse cx="168.1678" cy="106.1304" fill="#F1F1F1" rx="67.1678" ry="15.8336" style="stroke:#181818;stroke-width:0.5;"/><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="85" x="122.6678" y="109.878">Select Track</text></g><g id="elem_LoadMeta"><ellipse cx="526.0678" cy="96.3104" fill="#F1F1F1" rx="73.0678" ry="17.0136" style="stroke:#181818;stroke-width:0.5;"/><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="101" x="472.5678" y="100.058">Load Metadata</text></g><g id="elem_PrepAudio"><ellipse cx="888.5529" cy="96.5075" fill="#F1F1F1" rx="71.5529" ry="16.7106" style="stroke:#181818;stroke-width:0.5;"/><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="97" x="837.0529" y="100.255">Prepare Audio</text></g><!--entity User--><g id="elem_User"><ellipse cx="22" cy="76.7969" fill="#F1F1F1" rx="8" ry="8" style="stroke:#181818;stroke-width:0.5;"/><path d="M22,84.7969 L22,111.7969 M9,92.7969 L35,92.7969 M22,111.7969 L9,126.7969 M22,111.7969 L35,126.7969 " fill="none" style="stroke:#181818;stroke-width:0.5;"/><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="32" x="6" y="141.292">User</text></g><g id="elem_GMN10"><path d="M358,163.2969 L358,255.4469 L188.14,121.8369 L358,263.4469 L358,627.2813 A0,0 0 0 0 358,627.2813 L694,627.2813 A0,0 0 0 0 694,627.2813 L694,173.2969 L684,163.2969 L358,163.2969 A0,0 0 0 0 358,163.2969 " fill="#FFFFCC" style="stroke:#181818;stroke-width:0.5;"/><path d="M684,163.2969 L684,173.2969 L694,173.2969 L684,163.2969 " fill="#FFFFCC" style="stroke:#181818;stroke-width:0.5;"/><text fill="#000000" font-family="sans-serif" font-size="13" font-weight="bold" lengthAdjust="spacing" textLength="111" x="364" y="180.3638">Pre-conditions:</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="134" x="364" y="195.4966">- Library &#273;&#227; c&#243; tracks</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="215" x="364" y="210.6294">- UI &#273;ang hi&#7875;n th&#7883; danh s&#225;ch nh&#7841;c</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="4" x="364" y="225.7622">&#160;</text><text fill="#000000" font-family="sans-serif" font-size="13" font-weight="bold" lengthAdjust="spacing" textLength="119" x="364" y="240.895">Post-conditions:</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="215" x="364" y="256.0278">- Track &#273;&#432;&#7907;c load v&#224;o AudioPlayer</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="169" x="364" y="271.1606">- Metadata hi&#7875;n th&#7883; tr&#234;n UI</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="122" x="364" y="286.2935">- S&#7861;n s&#224;ng &#273;&#7875; ph&#225;t</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="4" x="364" y="301.4263">&#160;</text><text fill="#000000" font-family="sans-serif" font-size="13" font-weight="bold" lengthAdjust="spacing" textLength="79" x="364" y="316.5591">Main Flow:</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="248" x="364" y="331.6919">1. User click v&#224;o track trong danh s&#225;ch</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="281" x="364" y="346.8247">2. View g&#7885;i AppController.loadTrack(filePath)</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="222" x="364" y="361.9575">3. PlaybackController t&#7841;o MediaFile</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="272" x="364" y="377.0903">4. MediaFile extract metadata b&#7857;ng TagLib</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="315" x="364" y="392.2231">5. AudioLoaderImpl load file b&#7857;ng Mix_LoadMUS()</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="234" x="364" y="407.356">6. PlayerState c&#7853;p nh&#7853;t currentTrack</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="161" x="364" y="422.4888">7. UI hi&#7875;n th&#7883; Now Playing</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="4" x="364" y="437.6216">&#160;</text><text fill="#000000" font-family="sans-serif" font-size="13" font-weight="bold" lengthAdjust="spacing" textLength="124" x="364" y="452.7544">Alternative Flow:</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="138" x="364" y="467.8872">A1. File kh&#244;ng t&#7891;n t&#7841;i:</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="167" x="380" y="483.02">- AudioLoader return error</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="146" x="380" y="498.1528">- Hi&#7875;n th&#7883; th&#244;ng b&#225;o l&#7895;i</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="16" x="364" y="513.2856">&#160;&#160;&#160;&#160;</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="182" x="364" y="528.4185">A2. File format kh&#244;ng h&#7895; tr&#7907;:</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="130" x="380" y="543.5513">- Mix_LoadMUS() fail</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="187" x="380" y="558.6841">- Log error v&#224; th&#244;ng b&#225;o user</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="16" x="364" y="573.8169">&#160;&#160;&#160;&#160;</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="124" x="364" y="588.9497">A3. Metadata b&#7883; l&#7895;i:</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="177" x="380" y="604.0825">- S&#7917; d&#7909;ng filename l&#224;m title</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="175" x="380" y="619.2153">- Artist/Album = "Unknown"</text></g><!--link User to Select--><g id="link_User_Select"><path d="M38.14,106.2969 C53.23,106.2969 71.47,106.2969 94.88,106.2969 " fill="none" id="User-to-Select" style="stroke:#181818;stroke-width:1.0;"/><polygon fill="#181818" points="100.88,106.2969,91.88,102.2969,95.88,106.2969,91.88,110.2969,100.88,106.2969" style="stroke:#181818;stroke-width:1.0;"/></g><!--link Select to LoadMeta--><g id="link_Select_LoadMeta"><path d="M234.71,104.4469 C296.69,102.7069 383.3724,100.2749 447.2524,98.4849 " fill="none" id="Select-to-LoadMeta" style="stroke:#181818;stroke-width:1.0;stroke-dasharray:7.0,7.0;"/><polygon fill="#181818" points="453.25,98.3169,444.1415,94.5705,448.252,98.4569,444.3656,102.5674,453.25,98.3169" style="stroke:#181818;stroke-width:1.0;"/><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="61" x="266" y="98.3638">&#171;include&#187;</text></g><!--link LoadMeta to PrepAudio--><g id="link_LoadMeta_PrepAudio"><path d="M599.09,96.2969 C662.37,96.2969 747.89,96.2969 810.77,96.2969 " fill="none" id="LoadMeta-to-PrepAudio" style="stroke:#181818;stroke-width:1.0;stroke-dasharray:7.0,7.0;"/><polygon fill="#181818" points="816.77,96.2969,807.77,92.2969,811.77,96.2969,807.77,100.2969,816.77,96.2969" style="stroke:#181818;stroke-width:1.0;"/><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="61" x="725" y="92.3638">&#171;include&#187;</text></g><!--SRC=[RLHDQzj04BthLmpk9JLOfKa_mAG6rn0QI4h0SQzbBQsbnUjTiHh52QMd7aiFeOTS4q8lXK1BsujrLEZ_q3_fxCgoh50T19fzC-_Dcz6cSw4IPjW2fYoOHqPdAXnfgGqiOu7SGu6ImsIqsuSZpK8uDGI37anI3YD6ht720p4J0KEXbUUbcte90Ld4ntX11GmFaAb8yYs0qiXVFo1zT43FQEH9FaD03KP4CK8eRBwhpm8a6B4RpziKXSu3WHtuu04zMSe3Ax8pvfB0zI5BeGgqGIx_c2CB6JA7iX4RQEDE3ASEE0opK6Y7in7tvNtqF2iEUhr1pR7czlt1fXxqONzVg41c8HyCl4tOOZQr7e0ywzVQ43rh6kXsAQCNQ1KAQr7QxtOfseCZCJNCNC3zPN4BGV4Bq3QVkhF98ON9EeX5cNzIW76PVuQGgHZIuYQ8GSNbwYOWR4MWK_mFGxKBzvT_VvJvRG3IsdTMNElAc1F9BcXA5bXxsgP3KtnN9CL1nkNgZoBoQn9rVqaeIEBY1ci5nqmeE91wMN4_zTqAG205AN2ShZjwQohGD4BONH_U2Rw4gCo_21WcoKWhWad9ZMybkovsPaBo4uRnOyhOyy6Ajpz4WmKaHpIr4WfsG632FVERJ-3dLW72ekvrMgv-afPJ5j4a2FtShtonm-RcS978oZ7BN8EFnVbxjmoJyOvLyg9ImiqO6Gq_A5TtYPlD7KAG6SCLEla4VUdRgROCVgkNBbsegFPnA94RHV_g6T-oSqX-kYRcSV6RP62PVrMkOT5tgsydj2MUVcVCZ09kZ3ORm9lMSAjAqu8yasL-9TOmoxQxPfjfis1OarBQ5SsFLgdXRFa1CoRavkX8HnM_7N-BBakvsMBRyvlzcrffJax3CIxpEmZB_1lbsraejk0WY-i5kBklwT-WIF79K4wp1RoYAqVDbLwgZiTLwEuoxny0]--></g></svg>
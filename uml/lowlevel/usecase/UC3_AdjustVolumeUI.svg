<?xml version="1.0" encoding="us-ascii" standalone="no"?><svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" contentStyleType="text/css" height="574px" preserveAspectRatio="none" style="width:1076px;height:574px;background:#FFFFFF;" version="1.1" viewBox="0 0 1076 574" width="1076px" zoomAndPan="magnify"><defs/><g><text fill="#000000" font-family="sans-serif" font-size="14" font-weight="bold" lengthAdjust="spacing" textLength="385" x="338.5" y="22.9951">UC3: Adjust Volume (UI) - Use Case Specification</text><!--cluster UC3: Adjust Volume (UI)--><g id="cluster_UC3: Adjust Volume (UI)"><rect fill="none" height="103" rx="2.5" ry="2.5" style="stroke:#181818;stroke-width:1.0;" width="985" x="85" y="44.2969"/><text fill="#000000" font-family="sans-serif" font-size="14" font-weight="bold" lengthAdjust="spacing" textLength="189" x="483" y="59.292">UC3: Adjust Volume (UI)</text></g><g id="elem_Drag"><ellipse cx="186.2932" cy="105.2555" fill="#F1F1F1" rx="85.2932" ry="19.4586" style="stroke:#181818;stroke-width:0.5;"/><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="131" x="120.7932" y="108.1022">Drag Volume Slider</text></g><g id="elem_Update"><ellipse cx="578.7229" cy="100.3415" fill="#F1F1F1" rx="93.2229" ry="21.0446" style="stroke:#181818;stroke-width:0.5;"/><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="149" x="504.2229" y="103.1881">Update Audio Volume</text></g><g id="elem_Save"><ellipse cx="969.4263" cy="99.0821" fill="#F1F1F1" rx="84.4263" ry="19.2853" style="stroke:#181818;stroke-width:0.5;"/><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="129" x="904.805" y="101.9708">Save Volume State</text></g><!--entity User--><g id="elem_User"><ellipse cx="22" cy="75.7969" fill="#F1F1F1" rx="8" ry="8" style="stroke:#181818;stroke-width:0.5;"/><path d="M22,83.7969 L22,110.7969 M9,91.7969 L35,91.7969 M22,110.7969 L9,125.7969 M22,110.7969 L35,125.7969 " fill="none" style="stroke:#181818;stroke-width:0.5;"/><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="32" x="6" y="140.292">User</text></g><g id="elem_GMN10"><path d="M395,163.7969 L395,239.5069 L215.24,123.7869 L395,247.5069 L395,567.25 A0,0 0 0 0 395,567.25 L762,567.25 A0,0 0 0 0 762,567.25 L762,173.7969 L752,163.7969 L395,163.7969 A0,0 0 0 0 395,163.7969 " fill="#FFFFCC" style="stroke:#181818;stroke-width:0.5;"/><path d="M752,163.7969 L752,173.7969 L762,173.7969 L752,163.7969 " fill="#FFFFCC" style="stroke:#181818;stroke-width:0.5;"/><text fill="#000000" font-family="sans-serif" font-size="13" font-weight="bold" lengthAdjust="spacing" textLength="111" x="401" y="180.8638">Pre-conditions:</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="110" x="401" y="195.9966">- UI &#273;ang hi&#7875;n th&#7883;</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="159" x="401" y="211.1294">- Audio system initialized</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="4" x="401" y="226.2622">&#160;</text><text fill="#000000" font-family="sans-serif" font-size="13" font-weight="bold" lengthAdjust="spacing" textLength="119" x="401" y="241.395">Post-conditions:</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="168" x="401" y="256.5278">- Volume &#273;&#227; &#273;&#432;&#7907;c thay &#273;&#7893;i</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="175" x="401" y="271.6606">- PlayerState l&#432;u gi&#225; tr&#7883; m&#7899;i</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="181" x="401" y="286.7935">- UI slider hi&#7875;n th&#7883; gi&#225; tr&#7883; m&#7899;i</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="4" x="401" y="301.9263">&#160;</text><text fill="#000000" font-family="sans-serif" font-size="13" font-weight="bold" lengthAdjust="spacing" textLength="79" x="401" y="317.0591">Main Flow:</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="257" x="401" y="332.1919">1. User k&#233;o slider volume tr&#234;n PlayerBar</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="276" x="401" y="347.3247">2. View g&#7885;i AppController.setVolume(value)</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="346" x="401" y="362.4575">3. VolumeController g&#7885;i AudioPlayer.setVolume(value)</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="332" x="401" y="377.5903">4. AudioVolumeImpl g&#7885;i Mix_VolumeMusic(sdlValue)</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="207" x="401" y="392.7231">5. PlayerState.setVolume(value)</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="159" x="401" y="407.856">6. UI c&#7853;p nh&#7853;t v&#7883; tr&#237; slider</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="4" x="401" y="422.9888">&#160;</text><text fill="#000000" font-family="sans-serif" font-size="13" font-weight="bold" lengthAdjust="spacing" textLength="124" x="401" y="438.1216">Alternative Flow:</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="186" x="401" y="453.2544">A1. Value ngo&#224;i range 0-100:</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="144" x="417" y="468.3872">- Clamp v&#7873; 0 ho&#7863;c 100</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="123" x="417" y="483.52">- Ti&#7871;p t&#7909;c main flow</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="4" x="401" y="498.6528">&#160;</text><text fill="#000000" font-family="sans-serif" font-size="13" font-weight="bold" lengthAdjust="spacing" textLength="48" x="401" y="513.7856">Notes:</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="172" x="401" y="528.9185">- SDL volume range: 0-128</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="137" x="401" y="544.0513">- UI/App range: 0-100</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="270" x="401" y="559.1841">- Conversion: sdlValue = value * 128 / 100</text></g><!--link User to Drag--><g id="link_User_Drag"><path d="M38.29,105.2969 C53.06,105.2969 70.68,105.2969 94.71,105.2969 " fill="none" id="User-to-Drag" style="stroke:#181818;stroke-width:1.0;"/><polygon fill="#181818" points="100.71,105.2969,91.71,101.2969,95.71,105.2969,91.71,109.2969,100.71,105.2969" style="stroke:#181818;stroke-width:1.0;"/></g><!--link Drag to Update--><g id="link_Drag_Update"><path d="M272.12,104.2169 C335.08,103.4069 414.9105,102.3839 479.5505,101.5539 " fill="none" id="Drag-to-Update" style="stroke:#181818;stroke-width:1.0;stroke-dasharray:7.0,7.0;"/><polygon fill="#181818" points="485.55,101.4769,476.4994,97.5928,480.5504,101.5411,476.6021,105.5921,485.55,101.4769" style="stroke:#181818;stroke-width:1.0;"/><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="61" x="303" y="99.3638">&#171;include&#187;</text></g><!--link Update to Save--><g id="link_Update_Save"><path d="M671.69,100.0569 C736.39,99.8969 816.22,99.6931 878.93,99.5231 " fill="none" id="Update-to-Save" style="stroke:#181818;stroke-width:1.0;stroke-dasharray:7.0,7.0;"/><polygon f
<?xml version="1.0" encoding="us-ascii" standalone="no"?><svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" contentStyleType="text/css" height="925px" preserveAspectRatio="none" style="width:1012px;height:925px;background:#FFFFFF;" version="1.1" viewBox="0 0 1012 925" width="1012px" zoomAndPan="magnify"><defs/><g><text fill="#000000" font-family="sans-serif" font-size="14" font-weight="bold" lengthAdjust="spacing" textLength="405" x="296.5" y="22.9951">UC8: Load Music from USB - Use Case Specification</text><!--cluster UC8: Load Music from USB--><g id="cluster_UC8: Load Music from USB"><rect fill="none" height="227" rx="2.5" ry="2.5" style="stroke:#181818;stroke-width:1.0;" width="921" x="85" y="44.2969"/><text fill="#000000" font-family="sans-serif" font-size="14" font-weight="bold" lengthAdjust="spacing" textLength="209" x="441" y="59.292">UC8: Load Music from USB</text></g><g id="elem_Refresh"><ellipse cx="184.2532" cy="97.2475" fill="#F1F1F1" rx="77.7532" ry="17.9506" style="stroke:#181818;stroke-width:0.5;"/><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="113" x="125.1994" y="100.8777">Refresh Devices</text></g><g id="elem_Select"><ellipse cx="184.5656" cy="169.41" fill="#F1F1F1" rx="83.5656" ry="19.1131" style="stroke:#181818;stroke-width:0.5;"/><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="127" x="120.6623" y="172.3943">Select USB Device</text></g><g id="elem_Load"><ellipse cx="184.3963" cy="239.0761" fill="#F1F1F1" rx="64.3963" ry="15.2793" style="stroke:#181818;stroke-width:0.5;"/><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="77" x="142.8963" y="242.8237">Load Music</text></g><g id="elem_Scan"><ellipse cx="550.6868" cy="220.2342" fill="#F1F1F1" rx="72.6868" ry="16.9374" style="stroke:#181818;stroke-width:0.5;"/><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="100" x="497.6868" y="223.9818">Scan Directory</text></g><g id="elem_Extract"><ellipse cx="911.5591" cy="220.4087" fill="#F1F1F1" rx="78.5591" ry="18.1118" style="stroke:#181818;stroke-width:0.5;"/><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="115" x="851.8328" y="223.9493">Extract Metadata</text></g><!--entity User--><g id="elem_User"><ellipse cx="22" cy="139.7969" fill="#F1F1F1" rx="8" ry="8" style="stroke:#181818;stroke-width:0.5;"/><path d="M22,147.7969 L22,174.7969 M9,155.7969 L35,155.7969 M22,174.7969 L9,189.7969 M22,174.7969 L35,189.7969 " fill="none" style="stroke:#181818;stroke-width:0.5;"/><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="32" x="6" y="204.292">User</text></g><g id="elem_GMN14"><path d="M408.5,287.2969 L408.5,478.8906 L692.5,478.8906 L692.5,297.2969 L682.5,287.2969 L408.5,287.2969 " fill="#FFFFCC" style="stroke:#181818;stroke-width:0.5;"/><path d="M682.5,287.2969 L682.5,297.2969 L692.5,297.2969 L682.5,287.2969 " fill="#FFFFCC" style="stroke:#181818;stroke-width:1.0;"/><text fill="#000000" font-family="sans-serif" font-size="13" font-weight="bold" lengthAdjust="spacing" textLength="111" x="414.5" y="304.3638">Pre-conditions:</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="148" x="414.5" y="319.4966">- USB &#273;&#227; c&#7855;m v&#224;o m&#225;y</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="126" x="414.5" y="334.6294">- OS &#273;&#227; mount USB</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="4" x="414.5" y="349.7622">&#160;</text><text fill="#000000" font-family="sans-serif" font-size="13" font-weight="bold" lengthAdjust="spacing" textLength="119" x="414.5" y="364.895">Post-conditions:</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="217" x="414.5" y="380.0278">- Danh s&#225;ch device &#273;&#432;&#7907;c c&#7853;p nh&#7853;t</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="4" x="414.5" y="395.1606">&#160;</text><text fill="#000000" font-family="sans-serif" font-size="13" font-weight="bold" lengthAdjust="spacing" textLength="79" x="414.5" y="410.2935">Main Flow:</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="263" x="414.5" y="425.4263">1. User click "Refresh" tr&#234;n Storage panel</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="231" x="414.5" y="440.5591">2. StoragePanelHelper g&#7885;i controller</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="261" x="414.5" y="455.6919">3. StorageManager scan mounted drives</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="249" x="414.5" y="470.8247">4. Dropdown &#273;&#432;&#7907;c c&#7853;p nh&#7853;t v&#7899;i devices</text></g><g id="elem_GMN17"><path d="M391,514.7969 L391,918.25 A0,0 0 0 0 391,918.25 L710,918.25 A0,0 0 0 0 710,918.25 L710,524.7969 L700,514.7969 L399.54,514.7969 L197.2,254.6269 L391.54,514.7969 L391,514.7969 A0,0 0 0 0 391,514.7969 " fill="#FFFFCC" style="stroke:#181818;stroke-width:0.5;"/><path d="M700,514.7969 L700,524.7969 L710,524.7969 L700,514.7969 " fill="#FFFFCC" style="stroke:#181818;stroke-width:0.5;"/><text fill="#000000" font-family="sans-serif" font-size="13" font-weight="bold" lengthAdjust="spacing" textLength="111" x="397" y="531.8638">Pre-conditions:</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="142" x="397" y="546.9966">- Device &#273;&#227; &#273;&#432;&#7907;c ch&#7885;n</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="191" x="397" y="562.1294">- Path t&#7891;n t&#7841;i v&#224; c&#243; quy&#7873;n &#273;&#7885;c</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="4" x="397" y="577.2622">&#160;</text><text fill="#000000" font-family="sans-serif" font-size="13" font-weight="bold" lengthAdjust="spacing" textLength="119" x="397" y="592.395">Post-conditions:</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="193" x="397" y="607.5278">- Tracks &#273;&#432;&#7907;c th&#234;m v&#224;o library</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="179" x="397" y="622.6606">- UI hi&#7875;n th&#7883; s&#7889; l&#432;&#7907;ng loaded</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="4" x="397" y="637.7935">&#160;</text><text fill="#000000" font-family="sans-serif" font-size="13" font-weight="bold" lengthAdjust="spacing" textLength="79" x="397" y="652.9263">Main Flow:</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="206" x="397" y="668.0591">1. User ch&#7885;n device, click "Load"</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="257" x="397" y="683.1919">2. AppController.loadFromStorage(path)</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="282" x="397" y="698.3247">3. PlaylistManager.loadDirectoryAsync(path)</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="263" x="397" y="713.4575">4. Scan recursive t&#236;m *.mp3, *.wav, *.flac</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="298" x="397" y="728.5903">5. V&#7899;i m&#7895;i file: t&#7841;o MediaFile, extract metadata</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="111" x="397" y="743.7231">6. Add v&#224;o library</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="169" x="397" y="758.856">7. Notify "Loaded X tracks"</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="4" x="397" y="773.9888">&#160;</text><text fill="#000000" font-family="sans-serif" font-size="13" font-weight="bold" lengthAdjust="spacing" textLength="124" x="397" y="789.1216">Alternative Flow:</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="153" x="397" y="804.2544">A1. USB b&#7883; ng&#7855;t k&#7871;t n&#7889;i:</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="95" x="413" y="819.3872">- Scan d&#7915;ng l&#7841;i</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="155" x="413" y="834.52">- Error message hi&#7875;n th&#7883;</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="16" x="397" y="849.6528">&#160;&#160;&#160;&#160;</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="116" x="397" y="864.7856">A2. File b&#7883; corrupt:</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="58" x="413" y="879.9185">- Skip file</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="100" x="413" y="895.0513">- Continue scan</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="85" x="413" y="910.1841">- Log warning</text></g><!--link User to Refresh--><g id="link_User_Refresh"><path d="M38.34,157.0469 C48.77,149.1569 63.14,139.1469 77,132.2969 C94.45,123.6769 108.7823,118.234 126.7623,112.624 " fill="none" id="User-to-Refresh" style="stroke:#181818;stroke-width:1.0;"/><polygon fill="#181818" points="132.49,110.8369,122.7071,109.6991,127.7169,112.3261,125.0899,117.336,132.49,110.8369" style="stroke:#181818;stroke-width:1.0;"/></g><!--link User to Select--><g id="link_User_Select"><path d="M38.1,169.2969 C52.93,169.2969 70.77,169.2969 94.9,169.2969 " fill="none" id="User-to-Select" style="stroke:#181818;stroke-width:1.0;"/><polygon fill="#181818" points="100.9,169.2969,91.9,165.2969,95.9,169.2969,91.9,173.2969,100.9,169.2969" style="stroke:#181818;stroke-width:1.0;"/></g><!--link User to Load--><g id="link_User_Load"><path d="M38.37,181.2269 C48.81,188.9069 63.19,198.6569 77,205.2969 C96.68,214.7669 113.8677,220.8048 133.4077,226.4748 " fill="none" id="User-to-Load" style="stroke:#181818;stroke-width:1.0;"/><polygon fill="#181818" points="139.17,228.1469,131.6413,221.7972,134.3681,226.7535,129.4118,229.4803,139.17,228.1469" style="stroke:#181818;stroke-width:1.0;"/></g><!--link Load to Scan--><g id="link_Load_Scan"><path d="M247.66,236.0569 C312.03,232.6969 406.4082,227.7703 473.5182,224.2603 " fill="none" id="Load-to-Scan" style="stroke:#181818;stroke-width:1.0;stroke-dasharray:7.0,7.0;"/><polygon fill="#181818" points="479.51,223.9469,470.3134,220.4224,474.5168,224.208,470.7312,228.4115,479.51,223.9469" style="stroke:#181818;stroke-width:1.0;"/><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="61" x="299" y="227.3638">&#171;include&#187;</text></g><!--link Scan to Extract--><g id="link_Scan_Extract"><path d="M623.29,220.2969 C683.96,220.2969 764.68,220.2969 826.93,220.2969 " fill="none" id="Scan-to-Extract" style="stroke:#181818;stroke-width:1.0;stroke-dasharray:7.0,7.0;"/><polygon fill="#181818" points="832.93,220.2969,823.93,216.2969,827.93,220.2969,823.93,224.2969,832.93,220.2969" style="stroke:#181818;stroke-width:1.0;"/><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="61" x="741" y="216.3638">&#171;include&#187;</text
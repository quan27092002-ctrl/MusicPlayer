<?xml version="1.0" encoding="us-ascii" standalone="no"?><svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" contentStyleType="text/css" height="760px" preserveAspectRatio="none" style="width:739px;height:760px;background:#FFFFFF;" version="1.1" viewBox="0 0 739 760" width="739px" zoomAndPan="magnify"><defs/><g><text fill="#000000" font-family="sans-serif" font-size="14" font-weight="bold" lengthAdjust="spacing" textLength="434" x="145.5" y="22.9951">UC5: Control Playback (Board) - Use Case Specification</text><!--cluster UC5: Control Playback (Board)--><g id="cluster_UC5: Control Playback (Board)"><rect fill="none" height="154" rx="2.5" ry="2.5" style="stroke:#181818;stroke-width:1.0;" width="542" x="134" y="44.2969"/><text fill="#000000" font-family="sans-serif" font-size="14" font-weight="bold" lengthAdjust="spacing" textLength="238" x="286" y="59.292">UC5: Control Playback (Board)</text></g><g id="elem_Press"><ellipse cx="226.964" cy="166.4897" fill="#F1F1F1" rx="68.964" ry="16.1928" style="stroke:#181818;stroke-width:0.5;"/><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="90" x="178.964" y="170.2372">Press Button</text></g><g id="elem_Send"><ellipse cx="226.9563" cy="97.0881" fill="#F1F1F1" rx="76.9563" ry="17.7913" style="stroke:#181818;stroke-width:0.5;"/><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="111" x="168.5675" y="100.8069">Send Command</text></g><g id="elem_Execute"><ellipse cx="579.6107" cy="98.319" fill="#F1F1F1" rx="80.6107" ry="18.5221" style="stroke:#181818;stroke-width:0.5;"/><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="120" x="518.1726" y="101.6316">Execute Playback</text></g><!--entity Board--><g id="elem_Board"><ellipse cx="46.5" cy="67.7969" fill="#F08080" rx="8" ry="8" style="stroke:#181818;stroke-width:0.5;"/><path d="M46.5,75.7969 L46.5,102.7969 M33.5,83.7969 L59.5,83.7969 M46.5,102.7969 L33.5,117.7969 M46.5,102.7969 L59.5,117.7969 " fill="none" style="stroke:#181818;stroke-width:0.5;"/><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="81" x="6" y="132.292">S32K Board</text></g><!--entity User--><g id="elem_User"><ellipse cx="46.5" cy="178.7969" fill="#F1F1F1" rx="8" ry="8" style="stroke:#181818;stroke-width:0.5;"/><path d="M46.5,186.7969 L46.5,213.7969 M33.5,194.7969 L59.5,194.7969 M46.5,213.7969 L33.5,228.7969 M46.5,213.7969 L59.5,228.7969 " fill="none" style="stroke:#181818;stroke-width:0.5;"/><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="32" x="30.5" y="243.292">User</text></g><g id="elem_GMN12"><path d="M427,214.2969 L427,753.9453 L732,753.9453 L732,224.2969 L722,214.2969 L427,214.2969 " fill="#FFFFCC" style="stroke:#181818;stroke-width:0.5;"/><path d="M722,214.2969 L722,224.2969 L732,224.2969 L722,214.2969 " fill="#FFFFCC" style="stroke:#181818;stroke-width:1.0;"/><text fill="#000000" font-family="sans-serif" font-size="13" font-weight="bold" lengthAdjust="spacing" textLength="111" x="433" y="231.3638">Pre-conditions:</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="157" x="433" y="246.4966">- Serial connected (UC9)</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="129" x="433" y="261.6294">- Track &#273;&#227; &#273;&#432;&#7907;c load</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="4" x="433" y="276.7622">&#160;</text><text fill="#000000" font-family="sans-serif" font-size="13" font-weight="bold" lengthAdjust="spacing" textLength="119" x="433" y="291.895">Post-conditions:</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="226" x="433" y="307.0278">- Playback state thay &#273;&#7893;i t&#432;&#417;ng &#7913;ng</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="142" x="433" y="322.1606">- UI sync v&#7899;i state m&#7899;i</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="4" x="433" y="337.2935">&#160;</text><text fill="#000000" font-family="sans-serif" font-size="13" font-weight="bold" lengthAdjust="spacing" textLength="79" x="433" y="352.4263">Main Flow:</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="179" x="433" y="367.5591">1. User nh&#7845;n n&#250;t tr&#234;n Board</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="284" x="433" y="382.6919">2. Board g&#7917;i "cmd:{command}\n" qua Serial</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="161" x="433" y="397.8247">3. SerialIOImpl nh&#7853;n data</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="258" x="433" y="412.9575">4. BoardCommunicator parse command</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="201" x="433" y="428.0903">5. G&#7885;i AppController t&#432;&#417;ng &#7913;ng:</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="100" x="445" y="443.2231">- "play" &#8594; play()</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="126" x="445" y="458.356">- "pause" &#8594; pause()</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="104" x="445" y="473.4888">- "next" &#8594; next()</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="130" x="445" y="488.6216">- "prev" &#8594; previous()</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="240" x="433" y="503.7544">6. PlaybackController th&#7921;c hi&#7879;n action</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="155" x="433" y="518.8872">7. UI c&#7853;p nh&#7853;t tr&#7841;ng th&#225;i</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="4" x="433" y="534.02">&#160;</text><text fill="#000000" font-family="sans-serif" font-size="13" font-weight="bold" lengthAdjust="spacing" textLength="124" x="433" y="549.1528">Alternative Flow:</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="182" x="433" y="564.2856">A1. Command kh&#244;ng h&#7907;p l&#7879;:</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="218" x="449" y="579.4185">- BoardCommunicator log warning</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="123" x="449" y="594.5513">- B&#7887; qua command</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="16" x="433" y="609.6841">&#160;&#160;&#160;&#160;</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="197" x="433" y="624.8169">A2. No track loaded (cho play):</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="205" x="449" y="639.9497">- PlaybackController return error</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="123" x="449" y="655.0825">- Kh&#244;ng c&#243; thay &#273;&#7893;i</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="4" x="433" y="670.2153">&#160;</text><text fill="#000000" font-family="sans-serif" font-size="13" font-weight="bold" lengthAdjust="spacing" textLength="171" x="433" y="685.3481">Supported Commands:</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="144" x="433" y="700.481">- cmd:play - Ph&#225;t nh&#7841;c</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="157" x="433" y="715.6138">- cmd:pause - T&#7841;m d&#7915;ng</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="163" x="433" y="730.7466">- cmd:next - B&#224;i ti&#7871;p theo</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="139" x="433" y="745.8794">- cmd:prev - B&#224;i tr&#432;&#7899;c</text></g><!--link User to Press--><g id="link_User_Press"><path d="M62.72,204.7169 C87.93,198.7869 133.5393,188.0504 171.9793,179.0104 " fill="none" id="User-to-Press" style="stroke:#181818;stroke-width:1.0;"/><polygon fill="#181818" points="177.82,177.6369,168.1433,175.8034,172.9528,178.7815,169.9747,183.591,177.82,177.6369" style="stroke:#181818;stroke-width:1.0;"/></g><!--link Press to Board--><g id="link_Press_Board"><path d="M184.28,153.6669 C166.2,147.9069 144.89,140.7169 126,133.2969 C113.16,128.2569 104.8553,124.7065 92.5153,118.9965 " fill="none" id="Press-to-Board" style="stroke:#181818;stroke-width:1.0;"/><polygon fill="#181818" points="87.07,116.4769,93.5582,123.8866,91.6077,118.5766,96.9177,116.6262,87.07,116.4769" style="stroke:#181818;stroke-width:1.0;"/></g><!--link Board to Send--><g id="link_Board_Send"><path d="M87.11,97.2969 C105.6,97.2969 122.26,97.2969 143.86,97.2969 " fill="none" id="Board-to-Send" style="stroke:#181818;stroke-width:1.0;"/><polygon fill="#181818" points="149.86,97.2969,140.86,93.2969,144.86,97.2969,140.86,101.2969,149.86,97.2969" style="stroke:#181818;stroke-width:1.0;"/></g><!--link Send to Execute--><g id="link_Send_Execute"><path d="M304.05,97.5169 C361.64,97.6769 434.52,97.8904 492.95,98.0504 " fill="none" id="Send-to-Execute" style="stroke:#181818;stroke-width:1.0;stroke-dasharray:7.0,7.0;"/><polygon fill="#181818" points="498.95,98.0669,489.961,94.0422,493.95,98.0532,489.9391,102.0422,498.95,98.0669" style="stroke:#181818;stroke-width:1.0;"/><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="61" x="335" y="94.3638">&#171;include&#187;</text></g><!--link Send to GMN12--><g id="link_Send_GMN12"><path d="M269.09,112.5369 C281.02,118.0469 293.63,124.9969 304,133.2969 C348.55,168.9369 390.21,213.1769 426.96,258.0969 " fill="none" id="Send-GMN12" style="stroke:#181818;stroke-width:1.0;stroke-dasharray:7.0,7.0;"/></g><!--SRC=[VLDDQnH14BtFhoWsbsnW1qoCuX8Mai58Y1-1TMzUsfxEJfFPxh6d9yaIlEf9HC5JBeRWGIKGqTFEmSDA_iVuIwpgwPtTQB0FGqzNrQkFzoe_a2fZXetWEUC7GwCB5KSwrGQE4cb5OALD1GoYzIv4MbcZKzXBsPYSONbBCnEteGE3N434yDFF19VxaZChjGg2l47FC80DHT-E4Su8RfaQfcB1GMahjlugOMaRJnG5gTYtO3KOEKmin9BY7JxZ5jrQ_RNLNN35j83bzGsM7f9tf0rBlHzMQOAWIGwj_xRLWfC0y1IvuDHQQy-87C4BQxLoUTp3TP- -K34YZaPCrRNGmtMN-yU25rOq-PoRVmnU1W5L2PrEpyFNMUdVbHNKpT6_WtO9mx0tGu0kR6n8nTCY5hrU4D1O_Tpq_goQbHL4xN2jOabppBihA_ZQGREHB0KqA1oIY65v4DrhEzDJGwFvzMvwZf-howeyvv1gHcWreCxj3OZDK7FBi12Ri376L-K72VRgykfC3Q4gFwkXSnxiG3vM70whybJwY17TPqaUCQbWEzL7DVojq54AAgacdnIewGHLOgPVb1yLm6henJ2ioWi9BJwAkoUyfkVbCsJnHS5yr-Yz5lhxpfETKPOwt0i5CRCChRSz5h5RA98uIWgrYvnwH7HQ3-51LRwHi9bbNbWfLdYjrwxJ0_RRod0wBVZzwZtGRRazDp2KYxVGTS6anB6jBNHRZ37Yq8VWJUeYTyOxOKF2Oa59LNxZaCYgVAs0rUi4S3Sa4ZYsdTNTqq2h2PLka-bPGyHcQeLHkEI7Oe6FJIJ4QnyEakaFZC8qvncacCLtZPN-EyLK3-686IMT4BnNLRvrzCo7IuVI8AkFDHP6kY8Dab1vejqGs_CyDxHjX2sC0c6CDetVRbqgdtvVrEUirNwHPThGClZM6csJc2WbfSBXM3UnCpwt4NEqElWwWhWgltgTav78eowd7t4JP3NvcM5oeUV1o65ZDxHmfpoWNQU53lu0]--></g></svg>
<?xml version="1.0" encoding="us-ascii" standalone="no"?><svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" contentStyleType="text/css" height="695px" preserveAspectRatio="none" style="width:1078px;height:695px;background:#FFFFFF;" version="1.1" viewBox="0 0 1078 695" width="1078px" zoomAndPan="magnify"><defs/><g><text fill="#000000" font-family="sans-serif" font-size="14" font-weight="bold" lengthAdjust="spacing" textLength="416" x="324" y="22.9951">UC4: Adjust Volume (Board) - Use Case Specification</text><!--cluster UC4: Adjust Volume (Board)--><g id="cluster_UC4: Adjust Volume (Board)"><rect fill="none" height="164" rx="2.5" ry="2.5" style="stroke:#181818;stroke-width:1.0;" width="938" x="134" y="44.2969"/><text fill="#000000" font-family="sans-serif" font-size="14" font-weight="bold" lengthAdjust="spacing" textLength="220" x="493" y="59.292">UC4: Adjust Volume (Board)</text></g><g id="elem_Rotate"><ellipse cx="240.1144" cy="171.2198" fill="#F1F1F1" rx="90.1144" ry="20.4229" style="stroke:#181818;stroke-width:0.5;"/><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="142" x="169.1144" y="174.0664">Rotate Volume Knob</text></g><g id="elem_SendADC"><ellipse cx="239.8536" cy="97.1676" fill="#F1F1F1" rx="77.3536" ry="17.8707" style="stroke:#181818;stroke-width:0.5;"/><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="112" x="181.1333" y="100.8422">Send ADC Value</text></g><g id="elem_Parse"><ellipse cx="617.7532" cy="97.2475" fill="#F1F1F1" rx="77.7532" ry="17.9506" style="stroke:#181818;stroke-width:0.5;"/><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="113" x="558.6994" y="100.8777">Parse &amp; Convert</text></g><g id="elem_Update"><ellipse cx="980.9948" cy="97.1958" fill="#F1F1F1" rx="74.9948" ry="17.399" style="stroke:#181818;stroke-width:0.5;"/><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="106" x="924.9948" y="100.9434">Update Volume</text></g><!--entity Board--><g id="elem_Board"><ellipse cx="46.5" cy="67.7969" fill="#F08080" rx="8" ry="8" style="stroke:#181818;stroke-width:0.5;"/><path d="M46.5,75.7969 L46.5,102.7969 M33.5,83.7969 L59.5,83.7969 M46.5,102.7969 L33.5,117.7969 M46.5,102.7969 L59.5,117.7969 " fill="none" style="stroke:#181818;stroke-width:0.5;"/><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="81" x="6" y="132.292">S32K Board</text></g><!--entity User--><g id="elem_User"><ellipse cx="46.5" cy="178.7969" fill="#F1F1F1" rx="8" ry="8" style="stroke:#181818;stroke-width:0.5;"/><path d="M46.5,186.7969 L46.5,213.7969 M33.5,194.7969 L59.5,194.7969 M46.5,213.7969 L33.5,228.7969 M46.5,213.7969 L59.5,228.7969 " fill="none" style="stroke:#181818;stroke-width:0.5;"/><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="32" x="30.5" y="243.292">User</text></g><g id="elem_GMN14"><path d="M453,224.2969 L453,688.2813 L783,688.2813 L783,234.2969 L773,224.2969 L453,224.2969 " fill="#FFFFCC" style="stroke:#181818;stroke-width:0.5;"/><path d="M773,224.2969 L773,234.2969 L783,234.2969 L773,224.2969 " fill="#FFFFCC" style="stroke:#181818;stroke-width:1.0;"/><text fill="#000000" font-family="sans-serif" font-size="13" font-weight="bold" lengthAdjust="spacing" textLength="111" x="459" y="241.3638">Pre-conditions:</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="157" x="459" y="256.4966">- Serial connected (UC9)</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="152" x="459" y="271.6294">- Board &#273;ang ho&#7841;t &#273;&#7897;ng</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="4" x="459" y="286.7622">&#160;</text><text fill="#000000" font-family="sans-serif" font-size="13" font-weight="bold" lengthAdjust="spacing" textLength="119" x="459" y="301.895">Post-conditions:</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="168" x="459" y="317.0278">- Volume &#273;&#227; &#273;&#432;&#7907;c thay &#273;&#7893;i</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="184" x="459" y="332.1606">- UI slider sync v&#7899;i gi&#225; tr&#7883; m&#7899;i</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="4" x="459" y="347.2935">&#160;</text><text fill="#000000" font-family="sans-serif" font-size="13" font-weight="bold" lengthAdjust="spacing" textLength="79" x="459" y="362.4263">Main Flow:</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="236" x="459" y="377.5591">1. User xoay n&#250;m volume tr&#234;n Board</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="210" x="459" y="392.6919">2. Board &#273;&#7885;c ADC value (0-4095)</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="246" x="459" y="407.8247">3. Board g&#7917;i "VR: {value}\n" qua Serial</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="161" x="459" y="422.9575">4. SerialIOImpl nh&#7853;n data</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="309" x="459" y="438.0903">5. BoardCommunicator parse: value &#8594; volume%</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="235" x="459" y="453.2231">6. AppController.setVolume(percent)</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="266" x="459" y="468.356">7. VolumeController c&#7853;p nh&#7853;t AudioPlayer</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="169" x="459" y="483.4888">8. UI slider sync gi&#225; tr&#7883; m&#7899;i</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="4" x="459" y="498.6216">&#160;</text><text fill="#000000" font-family="sans-serif" font-size="13" font-weight="bold" lengthAdjust="spacing" textLength="124" x="459" y="513.7544">Alternative Flow:</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="154" x="459" y="528.8872">A1. Serial disconnected:</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="154" x="475" y="544.02">- Data kh&#244;ng &#273;&#432;&#7907;c nh&#7853;n</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="156" x="475" y="559.1528">- Volume kh&#244;ng thay &#273;&#7893;i</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="16" x="459" y="574.2856">&#160;&#160;&#160;&#160;</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="181" x="459" y="589.4185">A2. ADC value kh&#244;ng h&#7907;p l&#7879;:</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="200" x="475" y="604.5513">- BoardCommunicator log error</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="123" x="475" y="619.6841">- B&#7887; qua command</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="4" x="459" y="634.8169">&#160;</text><text fill="#000000" font-family="sans-serif" font-size="13" font-weight="bold" lengthAdjust="spacing" textLength="86" x="459" y="649.9497">Conversion:</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="207" x="459" y="665.0825">- ADC 0-4095 &#8594; Volume 0-100%</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="181" x="459" y="680.2153">- volume = adc * 100 / 4095</text></g><!--link User to Rotate--><g id="link_User_Rotate"><path d="M62.53,205.3969 C85.72,200.9169 125.7589,193.1748 164.9489,185.6048 " fill="none" id="User-to-Rotate" style="stroke:#181818;stroke-width:1.0;"/><polygon fill="#181818" points="170.84,184.4669,161.2447,182.2464,165.9307,185.4152,162.762,190.1012,170.84,184.4669" style="stroke:#181818;stroke-width:1.0;"/></g><!--link Rotate to Board--><g id="link_Rotate_Board"><path d="M186.26,154.8469 C167.12,148.5369 145.44,140.9969 126,133.2969 C113.18,128.2169 104.8778,124.6512 92.5278,118.9512 " fill="none" id="Rotate-to-Board" style="stroke:#181818;stroke-width:1.0;"/><polygon fill="#181818" points="87.08,116.4369,93.5754,123.8402,91.6198,118.5322,96.9279,116.5766,87.08,116.4369" style="stroke:#181818;stroke-width:1.0;"/></g><!--link Board to SendADC--><g id="link_Board_SendADC"><path d="M87.18,97.2969 C108.87,97.2969 130.49,97.2969 156.21,97.2969 " fill="none" id="Board-to-SendADC" style="stroke:#181818;stroke-width:1.0;"/><polygon fill="#181818" points="162.21,97.2969,153.21,93.2969,157.21,97.2969,153.21,101.2969,162.21,97.2969" style="stroke:#181818;stroke-width:1.0;"/></g><!--link SendADC to Parse--><g id="link_SendADC_Parse"><path d="M317.54,97.2969 C382.39,97.2969 468.92,97.2969 533.92,97.2969 " fill="none" id="SendADC-to-Parse" style="stroke:#181818;stroke-width:1.0;stroke-dasharray:7.0,7.0;"/><polygon fill="#181818" points="539.92,97.2969,530.92,93.2969,534.92,97.2969,530.92,101.2969,539.92,97.2969" style="stroke:#181818;stroke-width:1.0;"/><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="61" x="361" y="93.3638">&#171;include&#187;</text></g><!--link Parse to Update--><g id="link_Parse_Update"><path d="M696,97.2969 C758.02,97.2969 838.66,97.2969 899.89,97.2969 " fill="none" id="Parse-to-Update" style="stroke:#181818;stroke-width:1.0;stroke-dasharray:7.0,7.0;"/><polygon fill="#181818" points="905.89,97.2969,896.89,93.2969,900.89,97.2969,896.89,101.2969,905.89,97.2969" style="stroke:#181818;stroke-width:1.0;"/><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="61" x="814" y="93.3638">&#171;include&#187;</text></g><!--link SendADC to GMN14--><g id="link_SendADC_GMN14"><path d="M287.89,111.6269 C302.12,117.1669 317.33,124.3569 330,133.2969 C373.83,164.2169 415.56,203.0569 452.95,242.9869 " fill="none" id="SendADC-GMN14" style="stroke:#181818;stroke-width:1.0;stroke-dasharray:7.0,7.0;"/></g><!--SRC=[TLHDRzD04BtxLunI5QMHOj8le569bBggL1L4rIWzSTdQMsVfPjUirobHrIiS4495ue0uLRqXLUB0gJwcud-ONyBiUfqqXUx17xFFysRUctLwmaH251d24GbFOYKp4GMIImMd0wQffvdc5Fh1MXkwqPiirN0eUJQaKD-IH4LBq8H-IY4WUEabD6J7B2IQIU5vwJHrWgb9J7jwZBaK3JKHCQTt049gkdMFVs47Ln1ud1vhq18KYmSQ8cQ-j_b9g15Mwwskx84jfWOaBPzWuOL11r8Hxd1OfVAyAJdK7kwf1cSUuCfI6fg-QWTI4qqhr9wGHvQg3Cz3UrH4qDqEu93mZ5gO2M5a7hTF5DuUGI35Y2fjWJOs3-idqOpPWig8T-vvfYDeDZjL7QvA4x5zUAKKvhqgmTt1zpib6xHXSvE9a6SHxNIyCcPs7V7yjcTySaR8upkDDHhxYZP3AI9cl4dRZGP6cuXGZ7303O72qmZg_M1ZoMwLnTrUe1imaCNDfSQN8lycOjmkKyfK_oUdS-7sOdA5bzy_Y_mg13qWO_lzLsP1_Lr8EOjGe7GiGXWL-NS6CPjSWbP5_X669b0HlIHCm0wNfoN5ic-71Tv9p2acDqCObPHQJNu8fot0YZ_jeSW_XTRqaJ4TwgtcMcjZtVIvMe7Y8hzcK3iyQCEPHPs_5ZLucn6d4MBNVFUy-sftc70GW-BcMW3wG71ttMKAv72O2NF8SAWJurVRqVvv_yLLkeZu9pvqamJ7Iol9ELL-IdKfNJsXAgH2c_gU-axF6H12f4rATWtTB69odvCndXw0P_vzPH_IjCirLGB_12DwHzhkSjKZ7kHqEXPjE_J6jsri5au6aryu5LDpIo6c63S03ZNll5c61ysP-U6G0qoM02_o3pE-VoNbCWQgb5GpJ95_jaw5Y2CYgbeiZswAircDfg4ilRTck49RpULMQz42t20z1nA5q02CmsCmUC_yDipfylu2]--></g></svg>
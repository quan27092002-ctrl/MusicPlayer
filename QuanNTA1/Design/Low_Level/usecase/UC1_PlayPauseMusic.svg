-serif" font-size="13" lengthAdjust="spacing" textLength="156" x="375.5" y="151.1606">- PlayerState = PLAYING</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="189" x="375.5" y="166.2935">- UI hi&#7875;n th&#7883; tr&#7841;ng th&#225;i Playing</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="4" x="375.5" y="181.4263">&#160;</text><text fill="#000000" font-family="sans-serif" font-size="13" font-weight="bold" lengthAdjust="spacing" textLength="79" x="375.5" y="196.5591">Main Flow:</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="132" x="375.5" y="211.6919">1. User click n&#250;t Play</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="199" x="375.5" y="226.8247">2. View g&#7885;i AppController.play()</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="276" x="375.5" y="241.9575">3. PlaybackController g&#7885;i AudioPlayer.play()</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="288" x="375.5" y="257.0903">4. AudioPlaybackImpl g&#7885;i Mix_ResumeMusic()</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="208" x="375.5" y="272.2231">5. PlayerState c&#7853;p nh&#7853;t PLAYING</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="207" x="375.5" y="287.356">6. UI c&#7853;p nh&#7853;t icon Play &#8594; Pause</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="4" x="375.5" y="302.4888">&#160;</text><text fill="#000000" font-family="sans-serif" font-size="13" font-weight="bold" lengthAdjust="spacing" textLength="124" x="375.5" y="317.6216">Alternative Flow:</text><text fill="#000000" font-family="sans-serif" font-size="13" 
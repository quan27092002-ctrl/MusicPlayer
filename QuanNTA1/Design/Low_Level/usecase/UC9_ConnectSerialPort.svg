<?xml version="1.0" encoding="us-ascii" standalone="no"?><svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" contentStyleType="text/css" height="1013px" preserveAspectRatio="none" style="width:683px;height:1013px;background:#FFFFFF;" version="1.1" viewBox="0 0 683 1013" width="683px" zoomAndPan="magnify"><defs/><g><text fill="#000000" font-family="sans-serif" font-size="14" font-weight="bold" lengthAdjust="spacing" textLength="392" x="138.5" y="22.9951">UC9: Connect Serial Port - Use Case Specification</text><!--cluster UC9: Connect Serial Port--><g id="cluster_UC9: Connect Serial Port"><rect fill="none" height="277" rx="2.5" ry="2.5" style="stroke:#181818;stroke-width:1.0;" width="212" x="82" y="322.7969"/><text fill="#000000" font-family="sans-serif" font-size="14" font-weight="bold" lengthAdjust="spacing" textLength="196" x="90" y="337.792">UC9: Connect Serial Port</text></g><g id="elem_Scan"><ellipse cx="187.8925" cy="372.8754" fill="#F1F1F1" rx="63.3925" ry="15.0785" style="stroke:#181818;stroke-width:0.5;"/><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="74" x="147.8925" y="376.6229">Scan Ports</text></g><g id="elem_Select"><ellipse cx="188.2248" cy="437.9418" fill="#F1F1F1" rx="63.7248" ry="15.145" style="stroke:#181818;stroke-width:0.5;"/><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="75" x="147.7248" y="441.6894">Select Port</text></g><g id="elem_Connect"><ellipse cx="188.0937" cy="503.0246" fill="#F1F1F1" rx="54.0937" ry="14.7277" style="stroke:#181818;stroke-width:0.5;"/><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="59" x="155.5937" y="506.7721">Connect</text></g><g id="elem_Disconnect"><ellipse cx="188.0766" cy="567.7122" fill="#F1F1F1" rx="65.0766" ry="15.4153" style="stroke:#181818;stroke-width:0.5;"/><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="79" x="145.5766" y="571.4598">Disconnect</text></g><!--entity User--><g id="elem_User"><ellipse cx="22" cy="441.2969" fill="#F1F1F1" rx="8" ry="8" style="stroke:#181818;stroke-width:0.5;"/><path d="M22,449.2969 L22,476.2969 M9,457.2969 L35,457.2969 M22,476.2969 L9,491.2969 M22,476.2969 L35,491.2969 " fill="none" style="stroke:#181818;stroke-width:0.5;"/><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="32" x="6" y="505.792">User</text></g><g id="elem_GMN12"><path d="M370.5,43.2969 L370.5,239.4969 L209.31,358.3169 L370.5,247.4969 L370.5,250.0234 A0,0 0 0 0 370.5,250.0234 L643.5,250.0234 A0,0 0 0 0 643.5,250.0234 L643.5,53.2969 L633.5,43.2969 L370.5,43.2969 A0,0 0 0 0 370.5,43.2969 " fill="#FFFFCC" style="stroke:#181818;stroke-width:0.5;"/><path d="M633.5,43.2969 L633.5,53.2969 L643.5,53.2969 L633.5,43.2969 " fill="#FFFFCC" style="stroke:#181818;stroke-width:0.5;"/><text fill="#000000" font-family="sans-serif" font-size="13" font-weight="bold" lengthAdjust="spacing" textLength="111" x="376.5" y="60.3638">Pre-conditions:</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="233" x="376.5" y="75.4966">- Serial ports available tr&#234;n h&#7879; th&#7889;ng</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="4" x="376.5" y="90.6294">&#160;</text><text fill="#000000" font-family="sans-serif" font-size="13" font-weight="bold" lengthAdjust="spacing" textLength="119" x="376.5" y="105.7622">Post-conditions:</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="201" x="376.5" y="120.895">- Danh s&#225;ch ports &#273;&#432;&#7907;c hi&#7875;n th&#7883;</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="4" x="376.5" y="136.0278">&#160;</text><text fill="#000000" font-family="sans-serif" font-size="13" font-weight="bold" lengthAdjust="spacing" textLength="79" x="376.5" y="151.1606">Main Flow:</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="176" x="376.5" y="166.2935">1. User click "Refresh Ports"</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="252" x="376.5" y="181.4263">2. ConnectionPanelHelper g&#7885;i controller</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="189" x="376.5" y="196.5591">3. SerialConnectionImpl scan:</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="139" x="388.5" y="211.6919">- /dev/ttyUSB* (Linux)</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="140" x="388.5" y="226.8247">- /dev/ttyACM* (Linux)</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="175" x="376.5" y="241.9575">4. Dropdown &#273;&#432;&#7907;c c&#7853;p nh&#7853;t</text></g><g id="elem_GMN15"><path d="M338,285.7969 L338,498.7969 L242.06,502.7969 L338,506.7969 L338,719.5156 A0,0 0 0 0 338,719.5156 L676,719.5156 A0,0 0 0 0 676,719.5156 L676,295.7969 L666,285.7969 L338,285.7969 A0,0 0 0 0 338,285.7969 " fill="#FFFFCC" style="stroke:#181818;stroke-width:0.5;"/><path d="M666,285.7969 L666,295.7969 L676,295.7969 L666,285.7969 " fill="#FFFFCC" style="stroke:#181818;stroke-width:0.5;"/><text fill="#000000" font-family="sans-serif" font-size="13" font-weight="bold" lengthAdjust="spacing" textLength="111" x="344" y="302.8638">Pre-conditions:</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="125" x="344" y="317.9966">- Port &#273;&#227; &#273;&#432;&#7907;c ch&#7885;n</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="234" x="344" y="333.1294">- Port kh&#244;ng b&#7883; s&#7917; d&#7909;ng b&#7903;i app kh&#225;c</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="4" x="344" y="348.2622">&#160;</text><text fill="#000000" font-family="sans-serif" font-size="13" font-weight="bold" lengthAdjust="spacing" textLength="119" x="344" y="363.395">Post-conditions:</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="196" x="344" y="378.5278">- Serial connection established</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="157" x="344" y="393.6606">- Read thread &#273;ang ch&#7841;y</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="157" x="344" y="408.7935">- UI hi&#7875;n th&#7883; "Connected"</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="4" x="344" y="423.9263">&#160;</text><text fill="#000000" font-family="sans-serif" font-size="13" font-weight="bold" lengthAdjust="spacing" textLength="79" x="344" y="439.0591">Main Flow:</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="213" x="344" y="454.1919">1. User ch&#7885;n port, click "Connect"</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="246" x="344" y="469.3247">2. AppController.connectToPort(name)</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="309" x="344" y="484.4575">3. SerialConnectionImpl.connect(name, 115200)</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="239" x="344" y="499.5903">4. Open port v&#7899;i O_RDWR | O_NOCTTY</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="220" x="344" y="514.7231">5. Configure termios: 115200, 8N1</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="187" x="344" y="529.856">6. SerialIOImpl.startReading()</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="216" x="344" y="544.9888">7. Spawn background read thread</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="205" x="344" y="560.1216">8. UI update status "Connected"</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="4" x="344" y="575.2544">&#160;</text><text fill="#000000" font-family="sans-serif" font-size="13" font-weight="bold" lengthAdjust="spacing" textLength="124" x="344" y="590.3872">Alternative Flow:</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="158" x="344" y="605.52">A1. Port kh&#244;ng m&#7903; &#273;&#432;&#7907;c:</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="301" x="360" y="620.6528">- Error: "Permission denied" ho&#7863;c "Device busy"</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="172" x="360" y="635.7856">- UI hi&#7875;n th&#7883; error message</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="16" x="344" y="650.9185">&#160;&#160;&#160;&#160;</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="197" x="344" y="666.0513">A2. Port b&#7883; disconnect b&#7845;t ng&#7901;:</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="151" x="360" y="681.1841">- Read thread ph&#225;t hi&#7879;n</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="128" x="360" y="696.3169">- Cleanup resources</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="172" x="360" y="711.4497">- UI update "Disconnected"</text></g><g id="elem_GMN18"><path d="M379.5,754.7969 L379.5,1006.9219 L634.5,1006.9219 L634.5,764.7969 L624.5,754.7969 L379.5,754.7969 " fill="#FFFFCC" style="stroke:#181818;stroke-width:0.5;"/><path d="M624.5,754.7969 L624.5,764.7969 L634.5,764.7969 L624.5,754.7969 " fill="#FFFFCC" style="stroke:#181818;stroke-width:1.0;"/><text fill="#000000" font-family="sans-serif" font-size="13" font-weight="bold" lengthAdjust="spacing" textLength="111" x="385.5" y="771.8638">Pre-conditions:</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="114" x="385.5" y="786.9966">- &#272;ang connected</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="4" x="385.5" y="802.1294">&#160;</text><text fill="#000000" font-family="sans-serif" font-size="13" font-weight="bold" lengthAdjust="spacing" textLength="119" x="385.5" y="817.2622">Post-conditions:</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="126" x="385.5" y="832.395">- Connection closed</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="143" x="385.5" y="847.5278">- Read thread stopped</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="112" x="385.5" y="862.6606">- Resources freed</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="4" x="385.5" y="877.7935">&#160;</text><text fill="#000000" font-family="sans-serif" font-size="13" font-weight="bold" lengthAdjust="spacing" textLength="79" x="385.5" y="892.9263">Main Flow:</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="162" x="385.5" y="908.0591">1. User click "Disconnect"</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="186" x="385.5" y="923.1919">2. AppController.disconnect()</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="185" x="385.5" y="938.3247">3. SerialIOImpl.stopReading()</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="117" x="385.5" y="953.4575">4. Join read thread</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="234" x="385.5" y="968.5903">5. SerialConnectionImpl.disconnect()</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="141" x="385.5" y="983.7231">6. Close file descriptor</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="179" x="385.5" y="998.856">7. UI update "Disconnected"</text></g><!--link User to Scan--><g id="link_User_Scan"><path d="M38.04,443.9369 C46.89,430.3969 59.24,414.7669 74,404.7969 C91.65,392.8669 107.8813,386.7189 127.8213,381.9989 " fill="none" id="User-to-Scan" style="stroke:#181818;stroke-width:1.0;"/><polygon fill="#181818" points="133.66,380.6169,123.9806,378.7975,128.7945,381.7686,125.8234,386.5824,133.66,380.6169" style="stroke:#181818;stroke-width:1.0;"/></g><!--link User to Select--><g id="link_User_Select"><path d="M38.13,467.7469 C60.89,463.1769 99.0278,455.5002 133.3278,448.6002 " fill="none" id="User-to-Select" style="stroke:#181818;stroke-width:1.0;"/><polygon fill="#181818" points="139.21,447.4169,129.5979,445.2704,134.3082,448.403,131.1756,453.1133,139.21,447.4169" style="stroke:#181818;stroke-width:1.0;"/></g><!--link User to Connect--><g id="link_User_Connect"><path d="M38.13,473.7469 C61.92,478.3869 103.051,486.4181 137.911,493.2181 " fill="none" id="User-to-Connect" style="stroke:#181818;stroke-width:1.0;"/><polygon fill="#181818" points="143.8,494.3669,135.7323,488.7178,138.8925,493.4096,134.2007,496.5698,143.8,494.3669" style="stroke:#181818;stroke-width:1.0;"/></g><!--link User to Disconnect--><g id="link_User_Disconnect"><path d="M38.03,496.4669 C46.95,509.6569 59.37,524.9769 74,534.7969 C91.65,546.6369 107.7869,552.8606 127.6369,557.7906 " fill="none" id="User-to-Disconnect" style="stroke:#181818;stroke-width:1.0;"/><polygon fill="#181818" points="133.46,559.2369,125.6895,553.1855,128.6074,558.0317,123.7612,560.9496,133.46,559.2369" style="stroke:#181818;stroke-width:1.0;"/></g><!--link Disconnect to GMN18--><g id="link_Disconnect_GMN18"><path d="M201.06,583.0069 C225.57,613.5569 283.5,684.0769 338,737.7969 C351.09,750.7069 365.18,763.7969 379.44,776.5569 " fill="none" id="Disconnect-GMN18" style="stroke:#181818;stroke-width:1.0;stroke-dasharray:7.0,7.0;"/></g><!--SRC=[XLLDRnit4BtlhnYe5qUmbDYjsrI70iwwGHqqiM7P27egQEveb_2A94YkNAF9gOSSYW3rEGWA8yYbG80S2XImZZRwF_HFEkH-Ih1g7IHnENmpVE_Dh3qJKZF3fd3A-5bgL26JMENAm7ac74PEk1pX9Fvs1B6I4hc3CHh1SZXKni40JYn2pEXhh96BYU3C2IMZo3R0ce1PYcDtGKY649XCS-m4IENmoKhsBvxI9uwZ72SEd08Zqin18lpvWC-uep3ARgAe0ONUkafxy6i4z2aiSbzjRyoP33ks1yo2Nwu4OEunoiC-8goNOwf4OR_wlnom9oplnBJBw7KK-U9XCFYkJDwkoaJDkWPk7dHG8izTHOwQrBVezmyD3YWc4PuiE-htwUcWvaFxMmERCP6pKoBDcPk_96IB-Hjmz7qfKuekOPHrT-3iCPc1lRdYMOLrU_dlvyNy0uTCBEQ_oG3pUmtod0a9JtDrNXxV6WRLWEU2dq7l22S6RLP9GVlRm_h6bFAGISn_m5pJWNGnVok0gd56vJdf3l3biBfJUs9_gdEmnCCeA47LFanmzj2vYvFnapvi_2XaySk3rRtT-7btxwiXx1cb4tKksxlnnVKd3JAZ7nUXJ89lLnLeNR1EXD0tjvSt7ph8HDTRsUwUPJT_onHEYKImY_adI1RpZ-M3FmKmhNt45Rz7fKfjtb03Q1q9Bco6IOWuGfQGLiR_t5vI1_bAhgykmkR9_fAQZTanwTsdRBXEiCPcBNFTAQN0krh7ZOx3gi9ZvI-_8TaK7wpNjeuESPkmjRMp_UXHfTc1nZ8jp1RpTm8EVZxQUta4h-ZFYuFu-FWd2ji9zfg8j33aV3HJeUoeWjc4no-sAERhElN-GKX9j1ddoH8otV2vlg40pSWSxT04qv994O-7di129upSGUTTOUzYS3Ud4YIDp1bsYDmb9hj6c9BkZLigNvD2tnkZp0XwX_uMrdg54vI2u25JY-j_ECqVd0cES5hOYrvpRbLPz3WmHMjfJ5THlehjgehWmwGPEhI-_kX0KZ- -RulfUacJErt8yKOs0N6EJ1QQUBAgC1njjvwAgCwyz2IjQxBE05pVPxT_14FNQFSqIsioSgooTpI8TKhhvdbr1w3XrMB__wJhl0lkweAMu8qb-pSULBfhGRBxCqNfbcstiwPfLi39uB6_9Km4pVy4BJT2q_kqjFRzUlm7]--></g></svg>
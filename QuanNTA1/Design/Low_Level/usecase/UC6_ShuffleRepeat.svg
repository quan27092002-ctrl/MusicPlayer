<?xml version="1.0" encoding="us-ascii" standalone="no"?><svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" contentStyleType="text/css" height="710px" preserveAspectRatio="none" style="width:712px;height:710px;background:#FFFFFF;" version="1.1" viewBox="0 0 712 710" width="712px" zoomAndPan="magnify"><defs/><g><text fill="#000000" font-family="sans-serif" font-size="14" font-weight="bold" lengthAdjust="spacing" textLength="414" x="142" y="22.9951">UC6: Toggle Shuffle/Repeat - Use Case Specification</text><!--cluster UC6: Toggle Shuffle/Repeat--><g id="cluster_UC6: Toggle Shuffle/Repeat"><rect fill="none" height="154" rx="2.5" ry="2.5" style="stroke:#181818;stroke-width:1.0;" width="234" x="82" y="295.2969"/><text fill="#000000" font-family="sans-serif" font-size="14" font-weight="bold" lengthAdjust="spacing" textLength="218" x="90" y="310.292">UC6: Toggle Shuffle/Repeat</text></g><g id="elem_Shuffle"><ellipse cx="198.3073" cy="347.1583" fill="#F1F1F1" rx="72.3073" ry="16.8615" style="stroke:#181818;stroke-width:0.5;"/><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="99" x="145.8073" y="350.9059">Toggle Shuffle</text></g><g id="elem_Repeat"><ellipse cx="198.4504" cy="416.3869" fill="#F1F1F1" rx="73.4504" ry="17.0901" style="stroke:#181818;stroke-width:0.5;"/><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="102" x="144.4504" y="420.1345">Toggle Repeat</text></g><!--entity User--><g id="elem_User"><ellipse cx="22" cy="352.7969" fill="#F1F1F1" rx="8" ry="8" style="stroke:#181818;stroke-width:0.5;"/><path d="M22,360.7969 L22,387.7969 M9,368.7969 L35,368.7969 M22,387.7969 L9,402.7969 M22,387.7969 L35,402.7969 " fill="none" style="stroke:#181818;stroke-width:0.5;"/><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="32" x="6" y="417.292">User</text></g><g id="elem_GMN8"><path d="M388,43.2969 L388,263.8769 L234.72,332.4469 L388,271.8769 L388,371.0859 A0,0 0 0 0 388,371.0859 L677,371.0859 A0,0 0 0 0 677,371.0859 L677,53.2969 L667,43.2969 L388,43.2969 A0,0 0 0 0 388,43.2969 " fill="#FFFFCC" style="stroke:#181818;stroke-width:0.5;"/><path d="M667,43.2969 L667,53.2969 L677,53.2969 L667,43.2969 " fill="#FFFFCC" style="stroke:#181818;stroke-width:0.5;"/><text fill="#000000" font-family="sans-serif" font-size="13" font-weight="bold" lengthAdjust="spacing" textLength="111" x="394" y="60.3638">Pre-conditions:</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="151" x="394" y="75.4966">- C&#243; tracks trong queue</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="4" x="394" y="90.6294">&#160;</text><text fill="#000000" font-family="sans-serif" font-size="13" font-weight="bold" lengthAdjust="spacing" textLength="119" x="394" y="105.7622">Post-conditions:</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="217" x="394" y="120.895">- Queue &#273;&#432;&#7907;c shuffle ho&#7863;c restore</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="237" x="394" y="136.0278">- PlayerState.shuffleEnabled updated</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="107" x="394" y="151.1606">- UI icon thay &#273;&#7893;i</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="4" x="394" y="166.2935">&#160;</text><text fill="#000000" font-family="sans-serif" font-size="13" font-weight="bold" lengthAdjust="spacing" textLength="203" x="394" y="181.4263">Main Flow (Enable Shuffle):</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="171" x="394" y="196.5591">1. User click Shuffle button</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="257" x="394" y="211.6919">2. View g&#7885;i AppController.toggleShuffle()</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="243" x="394" y="226.8247">3. PlaybackController l&#432;u originalOrder</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="232" x="394" y="241.9575">4. PlaylistManager randomize queue</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="245" x="394" y="257.0903">5. PlayerState.setShuffleEnabled(true)</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="165" x="394" y="272.2231">6. UI highlight Shuffle icon</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="4" x="394" y="287.356">&#160;</text><text fill="#000000" font-family="sans-serif" font-size="13" font-weight="bold" lengthAdjust="spacing" textLength="253" x="394" y="302.4888">Alternative Flow (Disable Shuffle):</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="156" x="394" y="317.6216">A1. Shuffle &#273;ang enable:</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="252" x="410" y="332.7544">1. PlaylistManager restore originalOrder</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="249" x="410" y="347.8872">2. PlayerState.setShuffleEnabled(false)</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="186" x="410" y="363.02">3. UI un-highlight Shuffle icon</text></g><g id="elem_GMN11"><path d="M360,406.2969 L360,479.4469 L235.03,431.1769 L360,487.4469 L360,703.8203 A0,0 0 0 0 360,703.8203 L705,703.8203 A0,0 0 0 0 705,703.8203 L705,416.2969 L695,406.2969 L360,406.2969 A0,0 0 0 0 360,406.2969 " fill="#FFFFCC" style="stroke:#181818;stroke-width:0.5;"/><path d="M695,406.2969 L695,416.2969 L705,416.2969 L695,406.2969 " fill="#FFFFCC" style="stroke:#181818;stroke-width:0.5;"/><text fill="#000000" font-family="sans-serif" font-size="13" font-weight="bold" lengthAdjust="spacing" textLength="111" x="366" y="423.3638">Pre-conditions:</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="123" x="366" y="438.4966">- Player &#273;&#227; kh&#7903;i t&#7841;o</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="4" x="366" y="453.6294">&#160;</text><text fill="#000000" font-family="sans-serif" font-size="13" font-weight="bold" lengthAdjust="spacing" textLength="119" x="366" y="468.7622">Post-conditions:</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="150" x="366" y="483.895">- Repeat mode thay &#273;&#7893;i</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="221" x="366" y="499.0278">- PlayerState.repeatMode updated</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="4" x="366" y="514.1606">&#160;</text><text fill="#000000" font-family="sans-serif" font-size="13" font-weight="bold" lengthAdjust="spacing" textLength="254" x="366" y="529.2935">Main Flow (Cycle Through Modes):</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="172" x="366" y="544.4263">1. User click Repeat button</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="258" x="366" y="559.5591">2. View g&#7885;i AppController.toggleRepeat()</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="252" x="366" y="574.6919">3. PlaybackController &#273;&#7885;c current mode</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="324" x="366" y="589.8247">4. Cycle: OFF &#8594; REPEAT_ALL &#8594; REPEAT_ONE &#8594; OFF</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="264" x="366" y="604.9575">5. PlayerState.setRepeatMode(newMode)</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="188" x="366" y="620.0903">6. UI icon thay &#273;&#7893;i theo mode</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="4" x="366" y="635.2231">&#160;</text><text fill="#000000" font-family="sans-serif" font-size="13" font-weight="bold" lengthAdjust="spacing" textLength="112" x="366" y="650.356">Repeat Modes:</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="127" x="366" y="665.4888">- OFF: Kh&#244;ng repeat</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="241" x="366" y="680.6216">- REPEAT_ALL: Repeat to&#224;n b&#7897; playlist</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="219" x="366" y="695.7544">- REPEAT_ONE: Repeat b&#224;i hi&#7879;n t&#7841;i</text></g><!--link User to Shuffle--><g id="link_User_Shuffle"><path d="M38.18,379.2569 C61.32,374.6169 100.657,366.7157 137.037,359.4257 " fill="none" id="User-to-Shuffle" style="stroke:#181818;stroke-width:1.0;"/><polygon fill="#181818" points="142.92,358.2469,133.3095,356.0932,138.0175,359.2293,134.8813,363.9372,142.92,358.2469" style="stroke:#181818;stroke-width:1.0;"/></g><!--link User to Repeat--><g id="link_User_Repeat"><path d="M38.18,385.2569 C61.07,389.7169 99.6808,397.239 135.8508,404.289 " fill="none" id="User-to-Repeat" style="stroke:#181818;stroke-width:1.0;"/><polygon fill="#181818" points="141.74,405.4369,133.6715,399.7889,136.8324,404.4803,132.141,407.6412,141.74,405.4369" style="stroke:#181818;stroke-width:1.0;"/></g><!--